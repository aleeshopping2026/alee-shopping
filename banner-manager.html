<!doctype html>
<html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>බැනර් එකතු කිරීම — aleeshopping</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="banners.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172033;font:16px Arial,sans-serif}.wrap{max-width:760px;margin:28px auto;padding:24px;background:white;border:1px solid #fed7aa;border-radius:18px;box-shadow:0 12px 35px #0001}h1{color:#ff6900;margin-top:0}p{line-height:1.6}.help{background:#fff7ed;border-radius:10px;padding:12px 14px}label{display:grid;gap:6px;font-weight:700;margin:14px 0}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{background:#ff6900;color:white;border:0;border-radius:9px;padding:13px 18px;font-weight:800;font-size:16px;cursor:pointer}.status{margin-top:12px;color:#166534}.muted{color:#64748b;font-size:13px}</style></head>
<body><main class="wrap"><h1>aleeshopping — බැනර් එකතු කරන්න</h1>
<p class="help">පින්තූරයක් හෝ වීඩියෝවක් තෝරන්න. අවශ්‍ය නම් ඒ බැනරය ඔබන විට යා යුතු වෙබ් ලිපිනයත් දාන්න. ZIP එක හදා වෙබ් අඩවියේ ප්‍රධාන ෆෝල්ඩරයට උපුටාගෙන නැවත පළ කරන්න.</p>
<p id="bannerCount" class="muted"></p><form id="bannerForm">
<label>බැනර් පින්තූරය හෝ වීඩියෝව<input name="media" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" required></label>
<label>බැනරයේ නම / විස්තරය<input name="alt" placeholder="උදා: අලුත් ඇඳුම් එකතුව"></label>
<label>බැනරය ඔබන විට යා යුතු ලිපිනය<input name="link" type="url" placeholder="https://example.com/product"></label>
<button type="submit">බැනර් ZIP එක හදන්න</button><div id="status" class="status" role="status"></div></form></main>
<script>
const banners = Array.isArray(window.aleeBanners) ? [...window.aleeBanners] : [];
const count = document.getElementById('bannerCount');
const updateCount = () => count.textContent = `දැනට බැනර් ${banners.length}ක් ඇත. උපරිමය 2,000යි.`;
updateCount();
const slug = value => value.normalize('NFKD').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase() || 'banner';
document.getElementById('bannerForm').addEventListener('submit', async event => {
 event.preventDefault(); const form=event.currentTarget; const data=new FormData(form); const file=form.elements.media.files[0]; const status=document.getElementById('status');
 if (banners.length >= 2000) { status.textContent='බැනර් 2,000ක් දැනටමත් තිබෙනවා. තවත් එකතු කරන්න බැහැ.'; return; }
 if (!window.JSZip) { status.textContent='ZIP සකස් කිරීමේ සේවාව සම්බන්ධ වුණේ නැහැ. අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කර නැවත උත්සාහ කරන්න.'; return; }
 const link=String(data.get('link')||'').trim();
 if (link && !/^https?:\/\//i.test(link)) { status.textContent='සබැඳිය https:// හෝ http:// වලින් ආරම්භ කරන්න.'; return; }
 status.textContent='ZIP ගොනුව සකස් කරනවා…';
 try {
  const video=file.type.startsWith('video/');
  const ext=(file.name.match(/\.([a-z0-9]+)$/i)||[,'jpg'])[1].toLowerCase();
  const path=`assets/banner-${banners.length+1}-${slug(file.name.replace(/\.[^.]+$/,''))}.${ext}`;
  const zip=new JSZip(); zip.file(path,await file.arrayBuffer());
  const banner={ [video?'video':'image']:path, alt:String(data.get('alt')||file.name).trim() };
  if(link) banner.link=link;
  const updated=[...banners,banner];
  zip.file('banners.js',`window.aleeBanners = ${JSON.stringify(updated,null,2)};\n`);
  const blob=await zip.generateAsync({type:'blob'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`alee-banner-${updated.length}.zip`; a.click(); setTimeout(()=>URL.revokeObjectURL(url),30000);
  banners.push(banner); updateCount(); form.reset(); status.textContent='ZIP ගොනුව බාගත වුණා. එය වෙබ් අඩවියේ ප්‍රධාන ෆෝල්ඩරයට උපුටාගෙන නැවත පළ කරන්න.';
 } catch(error) { console.error(error); status.textContent='ZIP ගොනුව සකස් කරන්න බැරි වුණා. නැවත උත්සාහ කරන්න.'; }
});
</script></body></html>
