<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3fff6">
  <title>Snake Dash · ALEE Games</title>
  <link rel="stylesheet" href="../game-coins.css">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202b25;background:#f3fff6;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 16px 36px;background:radial-gradient(circle at 10% 0,#d6f4df 0,transparent 28rem),#f3fff6}.wrap{width:min(100%,520px);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.back{color:#53645a;text-decoration:none;font-weight:700}.brand{color:#f26322;font-size:13px;font-weight:900;letter-spacing:.18em}.heading{display:flex;align-items:end;justify-content:space-between;gap:12px}.heading h1{margin:0;font-size:clamp(36px,10vw,54px);letter-spacing:-.06em}.heading p{margin:5px 0 0;color:#6f7b72}.stats{display:flex;gap:8px}.stat{min-width:72px;padding:7px 11px;border-radius:13px;background:#e2f0e6;text-align:center}.stat small{display:block;color:#708175;font-size:10px;font-weight:800;letter-spacing:.1em}.stat strong{font-size:20px}.arena{position:relative;width:min(100%,440px);margin:20px auto 14px;padding:10px;border-radius:20px;background:#17372e;box-shadow:0 16px 34px #103f281a}.arena canvas{display:block;width:100%;height:auto;border-radius:12px;background:#eff9ed}.overlay{position:absolute;inset:10px;display:grid;place-items:center;border-radius:12px;background:#143c32b8;color:white;text-align:center;padding:24px}.overlay[hidden]{display:none}.overlay h2{margin:0 0 8px;font-size:30px}.overlay p{margin:0 0 16px}.start{border:0;border-radius:12px;padding:12px 20px;background:#ff7b35;color:white;font-weight:900;font-size:15px;cursor:pointer}.buttons{display:flex;justify-content:center;gap:9px}.secondary{border:1px solid #d3e5d7;border-radius:11px;padding:9px 15px;background:#fff;color:#344b3d;font-weight:800;cursor:pointer}.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);gap:7px;justify-content:center;margin:14px auto 0}.dpad button{border:1px solid #d3e5d7;border-radius:14px;background:#fff;color:#344b3d;font-size:21px;font-weight:900;touch-action:manipulation}.dpad button:active,.start:active,.secondary:active{transform:scale(.96)}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.help{text-align:center;color:#819087;font-size:12px}
  </style>
</head>
<body data-game-key="alee_snake">
  <main class="wrap">
    <nav class="top"><a class="back" href="../index.html">← Back to ALEE Shopping</a><span class="brand">ALEE GAMES</span></nav>
    <header class="heading"><div><h1>Snake Dash</h1><p>Grab the fruit. Don't hit the wall!</p></div><div class="stats"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div></div></header>
    <section class="game-coin-wallet" aria-label="ALEE game coins"><div><strong>🪙 ALEE Coins</strong><b id="coinBalance">—</b></div><a id="coinLogin" href="../index.html" hidden>Sign in to save coins</a><p id="coinStatus" role="status" aria-live="polite">Checking your account…</p></section>
    <div class="arena"><canvas id="game" width="480" height="480" aria-label="Snake game board"></canvas><div class="overlay" id="overlay"><div><h2 id="overlayTitle">Ready?</h2><p id="overlayText">Use arrows, WASD, or the touch pad.</p><button class="start" id="start" type="button">Start game</button></div></div></div>
    <div class="buttons"><button class="secondary" id="pause" type="button">Pause</button><button class="secondary" id="reset" type="button">Restart</button></div>
    <div class="dpad" aria-label="Touch controls"><button class="up" data-dir="up" aria-label="Up">↑</button><button class="left" data-dir="left" aria-label="Left">←</button><button class="down" data-dir="down" aria-label="Down">↓</button><button class="right" data-dir="right" aria-label="Right">→</button></div>
    <p class="help">Tip: tap the touch pad or use your keyboard.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../backend-config.js"></script>
  <script src="../game-coins.js"></script>
  <script>
  (()=>{
    const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),titleEl=document.getElementById('overlayTitle'),textEl=document.getElementById('overlayText'),startButton=document.getElementById('start'),pauseButton=document.getElementById('pause');
    const size=20,cell=24;let snake,food,dir,nextDir,score=0,timer=null,running=false,over=false;
    const getBest=()=>{try{return Number(localStorage.getItem('alee-snake-best')||0)}catch(_){return 0}},setBest=value=>{try{localStorage.setItem('alee-snake-best',String(value))}catch(_){}};bestEl.textContent=getBest();
    function placeFood(){let point;do{point={x:Math.floor(Math.random()*size),y:Math.floor(Math.random()*size)}}while(snake.some(part=>part.x===point.x&&part.y===point.y));food=point}
    function draw(){ctx.fillStyle='#eff9ed';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#e1eee0';ctx.lineWidth=1;for(let i=1;i<size;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(canvas.width,i*cell);ctx.stroke()}ctx.fillStyle='#ff7544';ctx.beginPath();ctx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.38,0,Math.PI*2);ctx.fill();snake.forEach((part,index)=>{ctx.fillStyle=index?'#64bd61':'#25824d';ctx.beginPath();ctx.roundRect(part.x*cell+2,part.y*cell+2,cell-4,cell-4,7);ctx.fill()});const head=snake[0];ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(head.x*cell+cell*.36,head.y*cell+cell*.38,2.4,0,Math.PI*2);ctx.arc(head.x*cell+cell*.66,head.y*cell+cell*.38,2.4,0,Math.PI*2);ctx.fill()}
    function reset(){clearInterval(timer);timer=null;running=false;over=false;score=0;scoreEl.textContent='0';snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={...dir};placeFood();titleEl.textContent='Ready?';textEl.textContent='Use arrows, WASD, or the touch pad.';startButton.textContent='Start game';overlay.hidden=false;pauseButton.textContent='Pause';draw()}
    function end(){clearInterval(timer);timer=null;running=false;over=true;titleEl.textContent='Game over';textEl.textContent=`Your score: ${score}. Give it another go!`;startButton.textContent='Play again';overlay.hidden=false;window.aleeGameCoins?.claim()}
    function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eats=head.x===food.x&&head.y===food.y,body=eats?snake:snake.slice(0,-1);if(head.x<0||head.x>=size||head.y<0||head.y>=size||body.some(part=>part.x===head.x&&part.y===head.y)){end();return}snake.unshift(head);if(eats){score+=10;scoreEl.textContent=String(score);if(score>getBest()){setBest(score);bestEl.textContent=String(score)}placeFood()}else snake.pop();draw()}
    function start(){if(running)return;if(over)reset();running=true;overlay.hidden=true;pauseButton.textContent='Pause';timer=setInterval(tick,Math.max(75,130-Math.floor(score/40)*5))}
    function pause(){if(over)return;if(running){clearInterval(timer);timer=null;running=false;titleEl.textContent='Paused';textEl.textContent='Ready when you are.';startButton.textContent='Resume';overlay.hidden=false;pauseButton.textContent='Resume'}else if(titleEl.textContent==='Paused')start()}
    function setDirection(name){const vector={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(vector&&!(vector.x===-dir.x&&vector.y===-dir.y))nextDir=vector;if(!running&&!over)start()}
    const keys={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
    document.addEventListener('keydown',event=>{if(keys[event.key]){event.preventDefault();setDirection(keys[event.key])}else if(event.key===' '){event.preventDefault();pause()}});
    document.querySelectorAll('[data-dir]').forEach(button=>button.addEventListener('click',()=>setDirection(button.dataset.dir)));
    startButton.addEventListener('click',start);pauseButton.addEventListener('click',pause);document.getElementById('reset').addEventListener('click',reset);reset();
  })();
  </script>
</body>
</html>
