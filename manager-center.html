<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6900"><title>Content Managers | aleeshopping"><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font:15px system-ui,Arial}.wrap{max-width:960px;margin:30px auto;padding:0 16px}.top,.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top a{color:#f36b00;text-decoration:none;font-weight:800}.top h1{margin:0;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card h2{margin:0 0 6px}.card p{color:#667085;min-height:42px}.button{display:inline-block;border-radius:10px;padding:10px 14px;background:#ff6900;color:#fff;text-decoration:none;font-weight:800}.note{padding:14px;border-radius:12px;background:#fff7ed;color:#713f12;line-height:1.55}@media(max-width:640px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><a href="index.html">← aleeshopping</a><h1>Content Managers</h1><span id="user"></span></header><section id="gate" class="card" hidden><h2>Host access only</h2><p>Sign in to aleeshopping with aleeshopping2026@gmail.com or aleeshopping@gmail.com, then open Content Managers from My Account.</p><a class="button" href="index.html">Go to site</a></section><div id="content" hidden><p class="note">Use each manager separately. Homepage banners and product popups produce ZIP files containing the changed settings and uploaded media; extract the ZIP contents over the site files and publish to GitHub. Country banners and offers save directly to Supabase. Their permissions are also restricted by Supabase policies.</p><section class="grid"><article class="card"><h2>Homepage Banner Manager</h2><p>Manage the home carousel, media, links, and display order.</p><a class="button" href="banner-manager.html">Open manager</a></article><article class="card"><h2>Country Banner Manager</h2><p>Manage country-based company promotions with rank and link.</p><a class="button" href="country-banner-manager.html">Open manager</a></article><article class="card"><h2>Offer Manager</h2><p>Add, edit, delete, and rank promotional offers.</p><a class="button" href="offer-manager.html">Open manager</a></article><article class="card"><h2>Product Popup Manager</h2><p>Manage the image/video strip and link shown in product details.</p><a class="button" href="product-ad-manager.html">Open manager</a></article></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js"></script><script>(async()=>{const gate=document.getElementById('gate'),content=document.getElementById('content'),client=window.aleeSupabase;if(!client){gate.hidden=false;return;}const{data:{session}}=await client.auth.getSession(),email=String(session?.user?.email||'').toLowerCase();document.getElementById('user').textContent=email;const allowed=['aleeshopping2026@gmail.com','aleeshopping@gmail.com'].includes(email);document.getElementById(allowed?'content':'gate').hidden=false;})();</script></body></html>
