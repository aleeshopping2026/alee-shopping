<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ff6900"><title>Offer Manager | aleeshopping</title>
  <link rel="icon" href="assets/alee-app-icon-192.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f6f8;--orange:#ff6900;--line:#eadfd5}*{box-sizing:border-box}body{margin:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.top a{color:var(--orange);font-weight:800;text-decoration:none}.top h1{font-size:20px;margin:0}.wrap{max-width:1100px;margin:24px auto;padding:0 18px}.intro{margin:0 0 18px;color:#667085}.layout{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:18px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px #1720330a}.card h2{font-size:19px;margin:0 0 16px}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700;display:grid;gap:6px}.form input,.form textarea,.form select{font:inherit;width:100%;border:1px solid #ddd6cf;border-radius:10px;padding:11px 12px;background:white}.form textarea{min-height:95px;resize:vertical}.hint{font-size:12px;color:#77808e;font-weight:400}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #ded6ce;border-radius:10px;background:white;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;color:#283244}.btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}.btn.danger{color:#b42318}.status{min-height:20px;color:#b54708;font-size:13px;white-space:pre-wrap}.list{display:grid;gap:10px}.offer{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px}.offer img{width:100px;height:78px;object-fit:cover;border-radius:9px;background:#f4f5f7}.offer strong{display:block}.offer small{display:block;color:#667085;margin-top:5px}.offer .actions{justify-content:flex-end}.empty{padding:22px;text-align:center;color:#667085;border:1px dashed #d0d5dd;border-radius:12px}.off{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.top{padding:14px 16px}.wrap{margin:16px auto;padding:0 12px}.card{padding:16px}.offer{grid-template-columns:72px minmax(0,1fr)}.offer img{width:72px;height:68px}.offer .actions{grid-column:1/-1;justify-content:flex-start}}
  </style>
</head>
<body>
  <header class="top"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> aleeshopping</a><h1><i class="fa-solid fa-tags" style="color:var(--orange)"></i> Offer Manager</h1><span id="who"></span></header>
  <main class="wrap"><p class="intro">Create image or video offers, add a destination link, and set the order they appear in.</p>
    <div id="gate" class="card off"><h2>Host access only</h2><p id="gateText">Sign in with an authorized aleeshopping host account to manage offers.</p><a class="btn primary" href="index.html">Go to aleeshopping sign in</a></div>
    <div id="manager" class="layout off">
      <section class="card"><h2 id="formTitle">Add an offer</h2><form class="form" id="offerForm">
        <label>Offer title<input name="title" required minlength="2" maxlength="120" placeholder="Weekend special"></label>
        <label>Category / label<input name="category" maxlength="100" placeholder="Fashion, Electronics…"></label>
        <label>Description<textarea name="description" maxlength="2000" placeholder="Offer details"></textarea></label>
        <label>Offer link<input name="link" type="url" maxlength="1000" placeholder="https://…"></label>
        <label>Image or video <span class="hint">JPG, PNG, WebP, GIF, MP4, WebM or MOV · max 50 MB</span><input name="media" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime"></label>
        <label>Display rank <span class="hint">Smaller numbers appear first.</span><input name="rank" type="number" min="0" max="99999" step="1" value="100" required></label>
        <label>Country<input name="country" maxlength="2" value="LK" required pattern="[A-Za-z]{2}" title="Use a two-letter country code, e.g. LK or US"></label>
        <div class="actions"><button class="btn primary" id="saveBtn" type="submit">Publish offer</button><button class="btn off" id="cancelBtn" type="button">Cancel edit</button></div><div class="status" id="status" role="status"></div>
      </form></section>
      <section class="card"><h2>Offers <span id="count" class="hint"></span></h2><div id="offerList" class="list"><div class="empty">Loading offers…</div></div></section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js"></script>
  <script>
  (async()=>{
    const admins=['aleeshopping2026@gmail.com','aleeshopping@gmail.com'],client=window.aleeSupabase,gate=document.getElementById('gate'),manager=document.getElementById('manager'),form=document.getElementById('offerForm'),status=document.getElementById('status');let user=null,editing=null;
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    if(!client){gate.classList.remove('off');document.getElementById('gateText').textContent='Supabase is not configured. Check backend-config.js.';return;}
    const {data:{session}}=await client.auth.getSession();user=session?.user||null;document.getElementById('who').textContent=user?.email||'';
    if(!user||!admins.includes(String(user.email||'').toLowerCase())){gate.classList.remove('off');return;}
    manager.classList.remove('off');await load();
    async function load(){const root=document.getElementById('offerList');root.innerHTML='<div class="empty">Loading offers…</div>';const {data,error}=await client.from('platform_posts').select('id,owner_id,title,category,description,link_url,media_url,country_code,sort_order,created_at').eq('post_type','ad').eq('ad_type','offer').order('sort_order',{ascending:true}).order('created_at',{ascending:false}).limit(300);if(error){root.innerHTML='<div class="empty">Could not load offers. Run the updated platform-posts-schema.sql in Supabase.<br>'+esc(error.message)+'</div>';return;}document.getElementById('count').textContent=`(${data.length})`;if(!data.length){root.innerHTML='<div class="empty">No offers yet. Add your first one using the form.</div>';return;}root.innerHTML=data.map(row=>`<article class="offer">${/\.(mp4|webm|mov)(?:\?|$)/i.test(row.media_url||'')?`<video src="${esc(row.media_url)}" muted playsinline preload="metadata"></video>`:`<img src="${esc(row.media_url||'assets/alee-app-icon-192.png')}" alt="" onerror="this.src='assets/alee-app-icon-192.png'">`}<div><strong>${esc(row.title)}</strong><small>${esc(row.category||'Offer')} · ${esc((row.country_code||'LK').toUpperCase())} · Rank ${Number(row.sort_order)||0}${row.link_url?` · <a href="${esc(row.link_url)}" target="_blank" rel="noopener">Open link</a>`:''}</small></div><div class="actions"><button class="btn" data-edit="${esc(row.id)}">Edit</button><button class="btn danger" data-delete="${esc(row.id)}">Delete</button></div></article>`).join('');root.querySelectorAll('img,video').forEach(media=>{media.style.cssText='width:100px;height:78px;object-fit:cover;border-radius:9px;background:#f4f5f7';});root.querySelectorAll('[data-edit]').forEach(btn=>btn.onclick=()=>edit(data.find(r=>r.id===btn.dataset.edit)));root.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=()=>remove(data.find(r=>r.id===btn.dataset.delete)));}
    function edit(row){editing=row;form.elements.title.value=row.title||'';form.elements.category.value=row.category||'';form.elements.description.value=row.description||'';form.elements.link.value=row.link_url||'';form.elements.rank.value=row.sort_order??100;form.elements.country.value=row.country_code||'LK';form.elements.media.value='';document.getElementById('formTitle').textContent='Edit offer';document.getElementById('saveBtn').textContent='Save changes';document.getElementById('cancelBtn').classList.remove('off');status.textContent=row.media_url?'Current media stays unless a replacement is selected.':'';window.scrollTo({top:0,behavior:'smooth'});}
    function reset(){editing=null;form.reset();form.elements.rank.value=100;form.elements.country.value='LK';document.getElementById('formTitle').textContent='Add an offer';document.getElementById('saveBtn').textContent='Publish offer';document.getElementById('cancelBtn').classList.add('off');}
    document.getElementById('cancelBtn').onclick=()=>{reset();status.textContent='';};
    form.onsubmit=async event=>{event.preventDefault();const submit=document.getElementById('saveBtn');submit.disabled=true;status.textContent='Saving offer…';let uploadedPath='';try{const values=new FormData(form),file=values.get('media');let mediaUrl=editing?.media_url||'';if(file?.size){if(file.size>50*1024*1024)throw new Error('Choose media under 50 MB.');const ext=(file.name.match(/\.([a-z0-9]+)$/i)||[])[1]||'jpg';uploadedPath=`${user.id}/offers/${crypto.randomUUID()}.${ext}`;const up=await client.storage.from('platform-posts').upload(uploadedPath,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;mediaUrl=client.storage.from('platform-posts').getPublicUrl(uploadedPath).data.publicUrl;}
      const payload={owner_id:editing?.owner_id||user.id,post_type:'ad',ad_type:'offer',title:String(values.get('title')).trim(),category:String(values.get('category')||'Offer').trim()||'Offer',description:String(values.get('description')||'').trim(),link_url:String(values.get('link')||'').trim(),media_url:mediaUrl,country_code:String(values.get('country')||'LK').trim().toUpperCase(),sort_order:Number(values.get('rank'))||0};const result=editing?await client.from('platform_posts').update(payload).eq('id',editing.id):await client.from('platform_posts').insert(payload);if(result.error)throw result.error;if(file?.size&&editing?.media_url)await removeOldFile(editing.media_url);status.textContent=editing?'Offer updated.':'Offer published.';reset();await load();
      }catch(error){if(uploadedPath)await client.storage.from('platform-posts').remove([uploadedPath]);console.error(error);status.textContent=`Could not save offer: ${error.message||error}. Check the Supabase SQL and storage policies.`;}finally{submit.disabled=false;}};
    async function removeOldFile(url){const marker='/storage/v1/object/public/platform-posts/',at=String(url).indexOf(marker);if(at>=0)await client.storage.from('platform-posts').remove([decodeURIComponent(url.slice(at+marker.length))]);}
    async function remove(row){if(!row||!confirm(`Delete “${row.title}”? This removes the offer from the site.`))return;const result=await client.from('platform_posts').delete().eq('id',row.id);if(result.error){status.textContent=`Could not delete: ${result.error.message}`;return;}await removeOldFile(row.media_url);status.textContent='Offer deleted.';await load();}
  })();
  </script>
</body></html>
