<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orders · aleeshopping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172033;font-family:'Plus Jakarta Sans',Arial,sans-serif}.top{display:flex;align-items:center;gap:14px;padding:12px max(16px,calc((100vw - 1120px)/2));background:#fff;border-bottom:1px solid #fed7aa}.top a{color:#e85d04;text-decoration:none;font-weight:800}.top strong{font-size:17px}.wrap{max-width:1120px;margin:28px auto;padding:0 16px}.title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.title h1{margin:0;font-size:26px}.title-actions{display:flex;gap:8px}.title button,.sign-in{border:0;border-radius:11px;padding:11px 15px;background:#e85d04;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}.title button:disabled{opacity:.55}.notice{padding:18px;background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;color:#7c2d12;line-height:1.6}.order-list{display:grid;gap:14px}.order{padding:18px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 4px 14px #17203308}.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.order-head h2{margin:0 0 4px;font-size:17px}.muted{color:#64748b;font-size:12px}.status{padding:6px 10px;border-radius:999px;background:#fff7ed;color:#9a3412;font-size:11px;font-weight:800}.body{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.body h3{margin:0 0 6px;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.05em}.body p{margin:4px 0;font-size:13px;overflow-wrap:anywhere}.items{margin:7px 0 0;padding-left:18px}.items li{margin:6px 0;font-size:13px}.total{margin-top:12px;padding-top:12px;border-top:1px solid #e2e8f0;font-weight:800}.order-actions{display:flex;align-items:center;gap:8px;margin-top:14px}.order-actions select{max-width:230px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit;font-size:12px}.order-actions a{display:inline-flex;gap:6px;align-items:center;color:#15803d;font-size:12px;font-weight:800;text-decoration:none}.hidden{display:none!important}@media(max-width:620px){.top{padding:10px 12px}.wrap{margin:18px auto;padding:0 11px}.title h1{font-size:21px}.body{grid-template-columns:1fr}.order{padding:14px}.title button{padding:9px 11px}.title-actions{gap:5px}}
  </style>
</head>
<body>
  <header class="top"><a href="index.html">← aleeshopping</a><strong>Orders</strong></header>
  <main class="wrap">
    <div class="title"><h1>Order inbox</h1><div class="title-actions"><button id="export" type="button" disabled><i class="fa-solid fa-file-excel"></i> Excel</button><button id="refresh" type="button"><i class="fa-solid fa-rotate"></i> Refresh</button></div></div>
    <div id="notice" class="notice">Checking your account…</div>
    <div id="orders" class="order-list"></div>
    <button id="signIn" class="sign-in hidden" type="button">Sign in with Google</button>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js"></script>
  <script>
    const db=window.aleeSupabase,notice=document.getElementById('notice'),root=document.getElementById('orders'),ADMIN='aleeshopping2026@gmail.com';let currentUser=null,feed=null,loadedRows=[],shopNames={};
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const labels={new:'New',confirmed:'Confirmed',processing:'Preparing',shipped:'Shipped',completed:'Completed',cancelled:'Cancelled'};
    async function init(){if(!db){notice.textContent='Supabase is not configured on this site.';return;}const {data}=await db.auth.getUser();currentUser=data.user;if(!currentUser){notice.textContent='Sign in to view orders for your shop.';document.getElementById('signIn').classList.remove('hidden');return;}await load();feed=db.channel('store-orders-inbox').on('postgres_changes',{event:'*',schema:'public',table:'store_orders'},()=>load()).subscribe();}
    async function load(){notice.textContent='Loading orders…';root.innerHTML='';const {data,error}=await db.from('store_orders').select('*').order('created_at',{ascending:false}).limit(250);if(error){notice.textContent=`Could not load orders: ${error.message}. Check seller-orders-schema.sql in Supabase.`;return;}const rows=data||[];loadedRows=rows;document.getElementById('export').disabled=!rows.length;if(!rows.length){notice.textContent=currentUser.email?.toLowerCase()===ADMIN?'No orders yet. New orders placed through the website will appear here.':'No orders for your shop yet.';return;}const shopIds=[...new Set(rows.map(row=>row.shop_id).filter(Boolean))];shopNames={};if(shopIds.length){const {data:shopRows}=await db.from('seller_shops_public').select('id,shop_name').in('id',shopIds);(shopRows||[]).forEach(shop=>shopNames[shop.id]=shop.shop_name);}notice.textContent=`${rows.length} order${rows.length===1?'':'s'} · updates appear automatically`;root.innerHTML=rows.map(row=>{const lines=Array.isArray(row.items)?row.items:[];const phone=`https://wa.me/${String(row.customer_phone||'').replace(/\D/g,'')}`;return `<article class="order"><div class="order-head"><div><h2>${esc(shopNames[row.shop_id]||'aleeshopping')} · ${esc(row.id.slice(0,8).toUpperCase())}</h2><div class="muted">${new Date(row.created_at).toLocaleString()}</div></div><span class="status">${esc(labels[row.status]||row.status)}</span></div><div class="body"><section><h3>Customer</h3><p><b>${esc(row.customer_name)}</b></p><p>${esc(row.customer_address)}</p><p>${esc(row.customer_phone)}${row.customer_phone2?` · ${esc(row.customer_phone2)}`:''}</p>${row.customer_note?`<p>Note: ${esc(row.customer_note)}</p>`:''}<p>Payment: ${esc(row.payment_method)}</p></section><section><h3>Items</h3><ul class="items">${lines.map(item=>`<li>${esc(item.name)}${item.color?` · ${esc(item.color)}`:''}${item.size?` · ${esc(item.size)}`:''} × ${Number(item.quantity)||1} — LKR ${(Number(item.price)||0).toLocaleString()}</li>`).join('')}</ul><div class="total">Total: LKR ${Number(row.total).toLocaleString()}</div></section></div><div class="order-actions"><select data-status="${esc(row.id)}" aria-label="Update order status">${Object.entries(labels).map(([value,text])=>`<option value="${value}" ${row.status===value?'selected':''}>${text}</option>`).join('')}</select><a href="${phone}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Contact customer</a></div></article>`;}).join('');root.querySelectorAll('[data-status]').forEach(select=>select.addEventListener('change',async()=>{select.disabled=true;const {error}=await db.from('store_orders').update({status:select.value}).eq('id',select.dataset.status);select.disabled=false;if(error){notice.textContent=`Could not update status: ${error.message}`;await load();}}));}
    function exportExcel(){if(!loadedRows.length)return;const columns=['Order ID','Date','Shop','Customer Name','Address','Phone 1','Phone 2','Items','Total LKR','Payment','Status','Note'];const cell=value=>{let text=String(value??'');if(/^[=+\-@\t\r]/.test(text))text="'"+text;return `"${text.replace(/"/g,'""')}"`;};const lines=[columns,...loadedRows.map(row=>[row.id,new Date(row.created_at).toLocaleString(),shopNames[row.shop_id]||'aleeshopping',row.customer_name,row.customer_address,row.customer_phone,row.customer_phone2,(row.items||[]).map(item=>`${item.name} x${item.quantity}${item.color?` ${item.color}`:''}${item.size?` ${item.size}`:''}`).join('; '),row.total,row.payment_method,labels[row.status]||row.status,row.customer_note])].map(row=>row.map(cell).join(',')).join('\r\n');const blob=new Blob(['\ufeff',lines],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`alee-shopping-orders-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);}
    document.getElementById('refresh').addEventListener('click',load);document.getElementById('export').addEventListener('click',exportExcel);document.getElementById('signIn').addEventListener('click',async()=>{const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});if(error)notice.textContent=error.message;});db?.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT'){currentUser=session?.user||null;if(currentUser)init();}});init();
  </script>
</body>
</html>
