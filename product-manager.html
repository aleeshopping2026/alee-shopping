<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Products — aleeshopping</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="products.js"></script>
<script src="categories.js"></script>
<script src="shops.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172033;font:16px Arial,sans-serif}.wrap{max-width:760px;margin:28px auto;padding:24px;background:white;border:1px solid #fed7aa;border-radius:18px;box-shadow:0 12px 35px #0001}h1{color:#ff6900;margin-top:0}p{line-height:1.6}.help{background:#fff7ed;border-radius:10px;padding:12px 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:700;margin:12px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:78px}button{background:#ff6900;color:white;border:0;border-radius:9px;padding:13px 18px;font-weight:800;font-size:16px;cursor:pointer}.status{margin-top:12px;color:#166534}.muted{color:#64748b;font-size:13px}@media(max-width:600px){.wrap{margin:10px;padding:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<h1>aleeshopping — Add a product</h1>
<p class="help">Enter the details and choose photos. Select “Create ZIP” and extract the downloaded ZIP into the folder containing your website files. Then publish the website again. No coding is required.</p>
<p><a href="shop-manager.html">Click here to add a shop</a></p>
<p id="catalogCount" class="muted"></p>
<form id="productForm">
<div class="grid"><label>Product name<input name="name" required></label><label>Price (LKR)<input name="price" type="number" min="1" required></label></div>
<label>Category<select name="category" id="categorySelect" required></select><span class="muted">Open a main category and choose a matching subcategory.</span></label>
<label>Shop selling this product<select name="shopId" id="shopSelect"></select><span class="muted">To add a new shop, use shop-manager.html.</span></label>
<label>Old price, if applicable<input name="oldPrice" type="number" min="0"></label>
<label>Product description<textarea name="desc"></textarea></label>
<label>Features (separate with commas)<input name="features" placeholder="e.g. Cotton fabric, machine washable"></label>
<label style="display:flex;align-items:center;gap:10px"><input name="freeShipping" type="checkbox" style="width:auto;transform:scale(1.2)"> Free shipping (show the yellow “FREE SHIPPING” label on the product card)</label>
<div class="grid"><label>Colors (separate with commas)<input name="colors" placeholder="e.g. Black, white, blue"></label><label>Sizes (separate with commas)<input name="sizes" placeholder="e.g. S, M, L, XL"></label></div>
<label>Product photos (up to 20)<input name="photos" type="file" accept="image/*" multiple required><span class="muted">Add colors and sizes for clothing so shoppers can choose them.</span></label>
<button type="submit">Create ZIP</button><div id="status" class="status" role="status"></div>
</form>
</main>
<script>
const catalog = Array.isArray(window.aleeProducts) ? window.aleeProducts : [];
const categories = Array.isArray(window.aleeCategories) ? [...window.aleeCategories] : [];
const categoryGroups = Array.isArray(window.aleeCategoryGroups) ? window.aleeCategoryGroups : [];
const catalogTabs = Array.isArray(window.aleeCatalogTabs) ? window.aleeCatalogTabs : [];
const shops = Array.isArray(window.aleeShops) ? [...window.aleeShops] : [];
const categorySelect = document.getElementById('categorySelect');
categorySelect.appendChild(new Option('Select a category',''));
categoryGroups.forEach(group => { const optionGroup=document.createElement('optgroup'); optionGroup.label=group.label; categories.filter(category=>category.parent===group.id).forEach(category=>optionGroup.appendChild(new Option(category.label,category.id))); categorySelect.appendChild(optionGroup); });
const shopSelect = document.getElementById('shopSelect');
shops.forEach(shop => { const option=document.createElement('option'); option.value=shop.id; option.textContent=shop.name; shopSelect.appendChild(option); });
document.getElementById('catalogCount').textContent = `${catalog.length} products are currently in the file.`;
const splitList = value => value.split(',').map(item => item.trim()).filter(Boolean);
const slug = value => value.normalize('NFKD').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase() || 'product';
document.getElementById('productForm').addEventListener('submit', async event => {
 event.preventDefault();
 const status = document.getElementById('status');
 const form = event.currentTarget;
 const data = new FormData(form);
 const photos = [...form.elements.photos.files];
 if (photos.length > 20) { status.textContent = 'Choose no more than 20 photos.'; return; }
 if (!window.JSZip) { status.textContent = 'Could not connect to the ZIP service. Check your internet connection and try again.'; return; }
 status.textContent = 'Creating ZIP…';
 try {
  const nextId = Math.max(0, ...catalog.map(item => Number(item.id) || 0)) + 1;
  const categoryId = String(data.get('category') || '');
  if (!categories.some(category => category.id === categoryId)) { status.textContent='Choose a subcategory for this product.'; return; }
  const imagePaths = [];
  const zip = new JSZip();
  for (let index=0; index<photos.length; index++) {
   const file = photos[index];
   const extension = (file.name.match(/\.([a-z0-9]+)$/i) || [,'jpg'])[1].toLowerCase();
   const path = `images/${nextId}-${slug(data.get('name'))}-${index+1}.${extension}`;
   zip.file(path, await file.arrayBuffer());
   imagePaths.push(path);
  }
  const product = { id:nextId, name:String(data.get('name')).trim(), price:Number(data.get('price')), discountPercent:0, category:categoryId, categoryLabel:categories.find(category=>category.id===categoryId)?.label||'', shopId:String(data.get('shopId') || shops[0]?.id || 'alee-shopping'), desc:String(data.get('desc')||'').trim(), features:splitList(String(data.get('features')||'')), images:imagePaths };
  if (form.elements.freeShipping.checked) product.freeShipping = true;
  const oldPrice = Number(data.get('oldPrice'));
  if (oldPrice > product.price) product.oldPrice = oldPrice;
  const colors = splitList(String(data.get('colors')||''));
  const sizes = splitList(String(data.get('sizes')||''));
  if (colors.length) product.colors = colors;
  if (sizes.length) product.sizes = sizes;
  const updated = [...catalog, product];
  const notice = { id:product.id, name:product.name, version:Date.now() };
  zip.file('products.js', `window.aleeProducts = ${JSON.stringify(updated, null, 2)};\nwindow.aleeLatestProductNotice = ${JSON.stringify(notice)};\n`);
  zip.file('categories.js', `window.aleeCategoryGroups = ${JSON.stringify(categoryGroups, null, 2)};\nwindow.aleeCatalogTabs = ${JSON.stringify(catalogTabs, null, 2)};\nwindow.aleeCategories = ${JSON.stringify(categories, null, 2)};\n`);
  zip.file('shops.js', `window.aleeShops = ${JSON.stringify(shops, null, 2)};\n`);
  const blob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href=url; link.download=`alee-product-${nextId}.zip`; link.click();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
  catalog.push(product);
  document.getElementById('catalogCount').textContent = `${catalog.length} products are now in the file.`;
  form.reset();
  status.textContent = 'ZIP downloaded. Extract it into the website root folder and publish the site again.';
 } catch (error) { console.error(error); status.textContent = 'Could not create the ZIP. Please try again.'; }
});
</script></body></html>
