<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Details — aleeshopping</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="shops.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172033;font:16px Arial,sans-serif}.wrap{max-width:760px;margin:28px auto;padding:24px;background:#fff;border:1px solid #fed7aa;border-radius:18px;box-shadow:0 12px 35px #0001}h1{color:#ff6900;margin-top:0}p{line-height:1.6}.help{background:#fff7ed;border-radius:10px;padding:12px 14px}label{display:grid;gap:7px;font-weight:700;margin:14px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:76px;resize:vertical}button{background:#ff6900;color:#fff;border:0;border-radius:9px;padding:13px 18px;font-weight:800;font-size:16px;cursor:pointer}.muted{color:#64748b;font-size:13px}.status{margin-top:12px;color:#166534}.shop-preview{display:flex;align-items:center;gap:12px;margin:15px 0}.shop-preview img{width:60px;height:60px;object-fit:cover;border-radius:50%;border:0;background:white}@media(max-width:600px){.wrap{margin:10px;padding:16px}}
</style>
</head>
<body><main class="wrap">
<h1>Add a Shop or Edit Shop Details</h1>
<p class="help">Select an existing shop to edit its phone number, address, and Facebook, Instagram, or TikTok links. For a new shop, enter its name and logo too. Include the +94 country code in phone numbers. Extract the ZIP into the website root folder and publish the site again.</p>
<p id="shopCount" class="muted"></p>
<form id="shopForm">
<label>Shop to edit<select id="shopPicker" name="shopPicker"></select><span class="muted">To add a shop, select “Add a new shop”.</span></label>
<label>Shop name<input name="name" maxlength="60" placeholder="e.g. aleeshopping Fashion" required></label>
<label>Shop order / Rank<input name="rank" type="number" min="1" step="1" required><span class="muted">Rank 1 appears first in the shop list. Change the rank to reorder shops.</span></label>
<label>Shop rating<input name="rating" type="number" min="1" max="5" step="1" required><span class="muted">Choose a rating from 1 to 5 stars.</span></label>
<label>Contact phone number<input name="phone" type="tel" placeholder="e.g. +94 76 123 4567"></label>
<label>Shop address<textarea name="address" placeholder="Shop address"></textarea></label>
<label>Facebook page link<input name="facebook" type="url" placeholder="https://facebook.com/..."></label>
<label>Instagram page link<input name="instagram" type="url" placeholder="https://instagram.com/..."></label>
<label>TikTok page link<input name="tiktok" type="url" placeholder="https://tiktok.com/@..."></label>
<label>Shop accent color<input name="accentColor" type="color" value="#ff6900"><span class="muted">Choose a color that suits the shop brand.</span></label>
<label>Shop logo / photo<input name="logo" type="file" accept="image/*"><span class="muted">A logo is required for a new shop. To change an existing logo, choose a new photo.</span></label>
<div class="shop-preview" id="preview" hidden><img id="previewImage" alt="Shop logo preview"><strong id="previewName"></strong></div>
<button id="submitButton" type="submit">Create Shop ZIP</button><div id="status" class="status" role="status" aria-live="polite"></div>
</form>
</main>
<script>
const shopCatalog = Array.isArray(window.aleeShops) ? [...window.aleeShops] : [];
const newLogoFiles = [];
const slug = value => value.normalize('NFKD').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase() || 'shop';
const form=document.getElementById('shopForm'), picker=document.getElementById('shopPicker'), logoInput=form.elements.logo;
const updateCount=()=>document.getElementById('shopCount').textContent=`${shopCatalog.length} shops currently in the file.`;
function fillShopFields(shop){
 form.elements.name.value=shop?.name||''; form.elements.phone.value=shop?.phone||''; form.elements.address.value=shop?.address||'';
 form.elements.rank.value=shop?.rank|| (shop?shopCatalog.indexOf(shop)+1:Math.max(0,...shopCatalog.map(item=>Number(item.rank)||0))+1); form.elements.rating.value=shop?.rating||5;
 form.elements.facebook.value=shop?.facebook||''; form.elements.instagram.value=shop?.instagram||''; form.elements.tiktok.value=shop?.tiktok||'';
 form.elements.accentColor.value=/^#[0-9a-f]{6}$/i.test(shop?.accentColor||'')?shop.accentColor:'#ff6900';
 document.getElementById('previewImage').style.borderColor=form.elements.accentColor.value;
 logoInput.value=''; logoInput.required=!shop;
 document.getElementById('submitButton').textContent=shop?'Update Shop and Create ZIP':'Create Shop ZIP';
 document.getElementById('previewName').textContent=shop?.name||'';
 document.getElementById('previewImage').src=shop?.logo||'';
 document.getElementById('preview').hidden=!shop?.logo;
}
function renderShopPicker(selectedId='__new__'){
 picker.replaceChildren(new Option('Add a new shop','__new__'));
 shopCatalog.forEach(shop=>picker.add(new Option(shop.name,String(shop.id))));
 picker.value=selectedId; fillShopFields(shopCatalog.find(shop=>String(shop.id)===selectedId)||null);
}
renderShopPicker(); updateCount();
picker.addEventListener('change',()=>fillShopFields(shopCatalog.find(shop=>String(shop.id)===picker.value)||null));
form.elements.name.addEventListener('input',event=>{document.getElementById('previewName').textContent=event.target.value;});
form.elements.accentColor.addEventListener('input',event=>{document.getElementById('previewImage').style.borderColor=event.target.value;});
logoInput.addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;document.getElementById('previewImage').src=URL.createObjectURL(file);document.getElementById('preview').hidden=false;});
document.getElementById('shopForm').addEventListener('submit', async event => {
 event.preventDefault();
 const name=String(form.elements.name.value||'').trim(), file=logoInput.files[0], status=document.getElementById('status');
 const selectedId=picker.value, existingIndex=shopCatalog.findIndex(shop=>String(shop.id)===selectedId), existing=existingIndex>=0?shopCatalog[existingIndex]:null;
 if(!existing&&!file){status.textContent='Choose a logo photo for the new shop.';return;}
 const rank=Number(form.elements.rank.value), rating=Number(form.elements.rating.value);
 if(!Number.isInteger(rank)||rank<1){status.textContent='Rank must be a whole number of 1 or higher.';return;}
 if(!Number.isInteger(rating)||rating<1||rating>5){status.textContent='Rating must be a whole number from 1 to 5.';return;}
 if(!window.JSZip){status.textContent='Check your internet connection to create the ZIP.';return;}
 if(shopCatalog.some(shop=>shop.name.toLowerCase()===name.toLowerCase()&&String(shop.id)!==String(existing?.id))){status.textContent='A shop with this name already exists.';return;}
 for(const field of ['facebook','instagram','tiktok']){const value=String(form.elements[field].value||'').trim();if(value&&!/^https?:\/\//i.test(value)){status.textContent='Social links must start with https:// or http://.';return;}}
 status.textContent='Creating ZIP…';
 try{
  let id=existing?.id||slug(name); if(!existing&&shopCatalog.some(shop=>String(shop.id)===id)) id += `-${Date.now().toString(36)}`;
  let logo=existing?.logo||'';
  if(file){const ext=(file.name.match(/\.([a-z0-9]+)$/i)||[,'jpg'])[1].toLowerCase();logo=`images/shop-${id}-${Date.now().toString(36)}.${ext}`;newLogoFiles.push({path:logo,file});}
  const record={...existing,id,name,logo,rank,rating,phone:form.elements.phone.value.trim(),address:form.elements.address.value.trim(),facebook:form.elements.facebook.value.trim(),instagram:form.elements.instagram.value.trim(),tiktok:form.elements.tiktok.value.trim(),accentColor:form.elements.accentColor.value};
  if(existing)shopCatalog[existingIndex]=record;else shopCatalog.push(record);
  const zip=new JSZip();
  zip.file('shops.js',`window.aleeShops = ${JSON.stringify(shopCatalog,null,2)};\n`);
  for(const item of newLogoFiles) zip.file(item.path,await item.file.arrayBuffer());
  const blob=await zip.generateAsync({type:'blob'}), url=URL.createObjectURL(blob), link=document.createElement('a');
  link.href=url; link.download='alee-shops.zip'; link.click(); setTimeout(()=>URL.revokeObjectURL(url),30000);
  updateCount(); renderShopPicker(existing?String(existing.id):'__new__');
  status.textContent=`${existing?'Shop details updated':'New shop added'}. ZIP downloaded. Extract it into the website root folder and publish the site again.`;
 }catch(error){console.error(error);status.textContent='Could not create the ZIP. Please try again.';}
});
</script></body></html>
