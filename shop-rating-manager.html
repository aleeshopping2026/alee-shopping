<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop rating manager — aleeshopping</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172033;font-family:'Plus Jakarta Sans',Arial,sans-serif}.wrap{width:min(100% - 28px,760px);margin:28px auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.head a{color:#e85d04;text-decoration:none;font-weight:800}.card{padding:18px;margin:12px 0;background:white;border:1px solid #fed7aa;border-radius:16px;box-shadow:0 8px 25px #1720330b}.shop{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:12px}.shop img{width:52px;height:52px;object-fit:cover;border:2px solid #ff6900;border-radius:50%}.name{font-weight:800}.key{margin-top:3px;color:#64748b;font-size:11px;overflow-wrap:anywhere}.stars{display:flex;gap:5px;margin-top:12px}.stars button{padding:0;color:#cbd5e1;background:transparent;border:0;font-size:28px;cursor:pointer}.stars button.on{color:#f59e0b}.save{margin-top:10px;padding:9px 14px;color:white;background:#ff6900;border:0;border-radius:9px;font-weight:800;cursor:pointer}.status{min-height:19px;margin:8px 0 0;color:#64748b;font-size:12px}.notice{padding:14px;background:#fff7ed;border-radius:12px;color:#9a3412;line-height:1.5}
</style>
</head>
<body><main class="wrap"><header class="head"><h1>Shop star ratings</h1><a href="index.html">← aleeshopping</a></header><p id="accountStatus" class="notice">Checking manager account…</p><section id="ratingList" aria-live="polite"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js"></script><script src="shops.js"></script>
<script>
(()=>{
 const admin='aleeshopping2026@gmail.com',supabase=window.aleeSupabase,root=document.getElementById('ratingList'),status=document.getElementById('accountStatus');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const rows=new Map();
 function render(){root.innerHTML=[...rows.values()].map(shop=>`<article class="card" data-key="${esc(shop.id)}"><div class="shop"><img src="${esc(shop.logo||'assets/alee-logo.png')}" alt=""><div><div class="name">${esc(shop.name)}</div><div class="key">${esc(shop.id)}</div></div></div><div class="stars" role="group" aria-label="Set shop rating">${[1,2,3,4,5].map(n=>`<button type="button" data-stars="${n}" class="${n<=shop.stars?'on':''}" aria-label="${n} stars">★</button>`).join('')}</div><button class="save" type="button">Save rating</button><p class="status" role="status"></p></article>`).join('');
  root.querySelectorAll('[data-key]').forEach(card=>{const key=card.dataset.key;card.querySelectorAll('[data-stars]').forEach(btn=>btn.addEventListener('click',()=>{rows.get(key).stars=Number(btn.dataset.stars);render()}));card.querySelector('.save').addEventListener('click',async()=>{const label=card.querySelector('.status');const {error}=await supabase.from('shop_profile_ratings').upsert({shop_key:key,stars:rows.get(key).stars,updated_at:new Date().toISOString()},{onConflict:'shop_key'});label.textContent=error?`Save failed: ${error.message}`:'Rating saved.';});});
 }
 async function init(){if(!supabase){status.textContent='Supabase setup was not found.';return;}const {data,error}=await supabase.auth.getUser();if(error||data?.user?.email?.toLowerCase()!==admin){status.textContent='Sign in to aleeshopping with the authorized manager account first. Only that account can change ratings.';return;}status.textContent='Manager access confirmed. Choose 1–5 stars and save.';const shops=[...(window.aleeShops||[]).map(s=>({id:String(s.id),name:s.name,logo:s.logo,stars:Number(s.rating)||5}))];const {data:remote}=await supabase.from('seller_shops_profile_public').select('id,shop_name,logo_url');(remote||[]).forEach(s=>shops.push({id:String(s.id),name:s.shop_name,logo:s.logo_url,stars:5}));const {data:ratings}=await supabase.from('shop_profile_ratings').select('shop_key,stars');const saved=new Map((ratings||[]).map(r=>[r.shop_key,Number(r.stars)]));shops.forEach(s=>{s.stars=saved.has(s.id)?saved.get(s.id):s.stars;rows.set(s.id,s)});render();}
 init().catch(error=>{status.textContent=`Could not load shops: ${error.message}`;});
})();
</script></body></html>
