<style>

body{background:var(--page);color:var(--ink)}.top{background:var(--surface);border-color:var(--line)}.brand{margin-left:auto;order:2}.theme-toggle{order:3;width:40px;height:40px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:50%;cursor:pointer}.profile-shell{max-width:935px;margin:18px auto 24px;padding:0 16px}.shop-profile{margin:0 0 20px;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none}.profile-top{display:grid;grid-template-columns:minmax(90px,1fr) 2fr;align-items:center;gap:24px}.profile-avatar{width:min(150px,100%);aspect-ratio:1;object-fit:cover;border:1px solid var(--line);border-radius:50%;background:#fff}.profile-identity{min-width:0}.profile-name{margin:0 0 16px!important;color:var(--ink)!important;font-size:clamp(19px,3vw,26px)!important;font-weight:500;line-height:1.2}.profile-stats{display:flex;align-items:center;gap:clamp(12px,4vw,52px)}.profile-stat{padding:0;color:var(--ink);background:none;border:0;text-align:left;font:inherit;cursor:pointer}.profile-stat strong{font-size:16px}.profile-stat span{margin-left:4px;color:var(--muted);font-size:14px}.profile-bio{margin:18px 0 14px;color:var(--ink);font-size:14px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}.profile-bio .bio-category{display:block;margin-bottom:3px;color:var(--muted);font-size:13px}.profile-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.profile-buttons button{min-height:38px;padding:8px 10px;color:var(--ink);background:#f5f5f5;border:1px solid #e5e5e5;border-radius:8px;font:700 13px 'Plus Jakarta Sans',Arial,sans-serif;cursor:pointer}.profile-buttons .follow-button{color:#fff;background:var(--orange);border-color:var(--orange)}.profile-buttons .follow-button.is-following{color:var(--ink);background:#f5f5f5;border-color:#e5e5e5}.profile-status{min-height:18px;margin-top:7px;color:var(--muted);font-size:12px}.section-title{margin:18px 0 10px;padding-top:12px;color:var(--ink);border-top:1px solid var(--line);font-size:15px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.card{position:relative;aspect-ratio:1;padding:0;overflow:hidden;background:var(--surface);border:0;border-radius:0}.card>img{width:100%;height:100%;object-fit:cover;border:0;border-radius:0}.card .shop-meta{position:absolute;left:5px;top:5px;margin:0;padding:2px 5px;color:#fff;background:#0008;border-radius:10px;font-size:8px}.card .shop-meta img{display:none}.card h3{position:absolute;right:0;bottom:0;left:0;min-height:0;margin:0;padding:24px 5px 5px;color:#fff;background:linear-gradient(transparent,#0009);font-size:10px}.card .price{position:absolute;right:5px;bottom:5px;margin:0;padding:2px 4px;color:#fff;background:#0008;border-radius:4px;font-size:9px}.empty{grid-column:1/-1}.profile-overlay{position:fixed;inset:0;z-index:12;display:none;align-items:center;justify-content:center;padding:16px;background:#0008}.profile-overlay.show{display:flex}.profile-dialog{position:relative;width:min(100%,440px);max-height:min(82vh,680px);overflow:auto;padding:22px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px #0003}.profile-dialog h2{margin:0 38px 16px 0;font-size:20px}.profile-dialog .share-close{position:sticky;float:right;top:0;margin:-10px -10px 0 0}.profile-list{display:grid;gap:8px}.profile-list-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}.profile-list-item img{width:42px;height:42px;object-fit:cover;border:1px solid var(--line);border-radius:50%}.profile-list-item span{min-width:0;overflow-wrap:anywhere}.contact-details{display:grid;gap:9px}.contact-details a,.contact-details div{display:flex;gap:10px;padding:12px;color:var(--ink);background:#f7f7f7;border-radius:9px;text-decoration:none;overflow-wrap:anywhere}.contact-details i{width:20px;color:var(--orange);text-align:center}[data-theme="dark"]{--page:#111;-- <body>
<header class="top"><a class="back" href="index.html">← ALEE SHOPPING</a><button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode"><i class="fa-solid fa-moon"></i></button><div class="brand"><h1 id="headerShopName">Shop</h1><img id="headerShopLogo" src="assets/alee-logo.png" alt="Shop logo"></div></header>
