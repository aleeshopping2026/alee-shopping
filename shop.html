<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — ALEE SHOPPING</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--orange:#ff6900;--shop-accent:#ff6900;--ink:#172033;--muted:#64748b;--line:#ffd1b3;--surface:#fff;--page:#f8fafc}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:'Plus Jakarta Sans',Arial,sans-serif}.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:10px max(16px,calc((100vw - 1200px)/2));background:var(--surface);border-bottom:1px solid var(--line)}.back{color:var(--orange);font-weight:800;text-decoration:none;white-space:nowrap}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:40px;height:40px;object-fit:cover;border:2px solid var(--shop-accent);border-radius:50%;background:white}.brand h1{margin:0;font-size:18px;overflow-wrap:anywhere}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.shop-profile{margin-bottom:22px;padding:22px;background:linear-gradient(120deg,#fff7ed 0%,#ffedd5 42%,#fce7f3 100%);border:1px solid #ffad70;border-radius:20px;box-shadow:0 12px 30px #ff690018}.profile-main{display:flex;align-items:center;justify-content:space-between;gap:18px}.profile-copy{min-width:0}.shop-kicker{margin-bottom:5px;color:#e85d04;font-size:11px;font-weight:900;letter-spacing:1.4px}.shop-profile h2{margin:0 0 5px;color:#b44300;font-size:clamp(22px,4vw,34px);overflow-wrap:anywhere}.shop-profile p{margin:0;color:#64748b;font-size:13px}.profile-logo{width:82px;height:82px;flex:0 0 82px;object-fit:cover;border:4px solid var(--shop-accent);border-radius:22px;background:#fff;box-shadow:0 5px 18px #d94f0033}.shop-contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px}.contact-card{display:flex;align-items:center;gap:10px;min-width:0;padding:11px 12px;color:#334155;text-decoration:none;background:#ffffffd9;border:1px solid #ffffff;border-radius:12px;overflow-wrap:anywhere;font-size:12px;font-weight:700}.contact-card i{width:22px;flex:0 0 22px;text-align:center;color:#ff6900;font-size:16px}.contact-card.address{grid-column:1/-1}.social-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.social-link{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;color:#fff;text-decoration:none;border-radius:20px;font-size:12px;font-weight:800;box-shadow:0 4px 10px #0002;transition:transform .16s}.social-link:hover{transform:translateY(-2px)}.social-link.facebook{background:#1877f2}.social-link.instagram{background:linear-gradient(115deg,#833ab4,#fd1d1d,#fcb045)}.social-link.youtube{background:#e62117}.social-link.tiktok{background:#111827}.section-title{margin:0 0 14px;color:#d94f00}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{display:flex;flex-direction:column;min-width:0;padding:8px;color:inherit;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-2px);border-color:var(--orange)}.card>img{width:100%;height:150px;object-fit:contain;background:#fff;border:1px solid #f1f5f9;border-radius:9px}.shop-meta{display:flex;align-items:center;gap:6px;margin:7px 0 2px;color:var(--orange);font-size:10px;font-weight:800}.shop-meta img{width:22px;height:22px;object-fit:cover;border:1px solid var(--shop-accent);border-radius:50%}.card h3{min-height:34px;margin:4px 0;font-size:12px;line-height:1.35}.price{margin-top:auto;color:var(--orange);font-size:14px;font-weight:800}.empty{padding:24px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.card>img{height:190px}.card h3{font-size:14px}}@media(max-width:480px){.top{gap:9px;padding:8px 10px}.back{font-size:12px}.brand{gap:7px}.brand img{width:34px;height:34px}.brand h1{font-size:14px}.wrap{margin:15px auto;padding:0 10px}.shop-profile{padding:15px}.profile-logo{width:66px;height:66px;flex-basis:66px;border-radius:18px}.shop-contact-grid{grid-template-columns:1fr}.contact-card.address{grid-column:auto}.social-link{padding:8px 10px;font-size:11px}}
</style>
<style>
.profile-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto}.profile-message-button,.share-button,.copy-link-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 14px;color:#fff;background:#e83e8c;border:0;border-radius:999px;font:800 13px 'Plus Jakarta Sans',Arial,sans-serif;cursor:pointer;box-shadow:0 5px 14px #e83e8c40;transition:background .16s,transform .16s}.profile-message-button:hover,.share-button:hover,.copy-link-button:hover{background:#d72d7b;transform:translateY(-1px)}.share-button:focus-visible,.share-modal button:focus-visible{outline:3px solid #f9a8d4;outline-offset:3px}.share-overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#0f172acc}.share-overlay.show{display:flex}.share-modal{position:relative;width:min(100%,380px);padding:26px 22px 22px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 24px 70px #0005}.share-modal h2{margin:0 34px 6px;color:#172033;font-size:21px;overflow-wrap:anywhere}.share-modal p{margin:0 0 16px;color:#64748b;font-size:13px}.share-close{position:absolute;top:12px;right:12px;width:36px;height:36px;color:#475569;background:#f1f5f9;border:0;border-radius:50%;font-size:16px;cursor:pointer}.share-qr{display:flex;align-items:center;justify-content:center;width:220px;height:220px;margin:0 auto 14px;padding:8px;background:#fff;border:1px solid #e2e8f0;border-radius:12px}.share-qr canvas,.share-qr img{max-width:100%;height:auto}.share-url{display:block;margin-bottom:14px;padding:10px;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;font-size:12px;overflow-wrap:anywhere}.share-status{min-height:18px;margin-top:9px;color:#475569;font-size:12px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.empty{grid-column:1/-1}@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}}@media(max-width:699px){.card{padding:6px}.card>img{height:clamp(84px,22vw,130px)}.grid{gap:8px}.card h3{font-size:clamp(10px,2vw,12px)}.price{font-size:clamp(11px,2.2vw,14px)}}@media(max-width:480px){.profile-actions{gap:7px}.profile-logo{width:54px;height:54px;flex-basis:54px;border-radius:15px}.share-button,.profile-message-button{width:42px;min-width:42px;min-height:42px;padding:0;font-size:16px}.profile-message-button .share-label{display:none}.share-button .share-label{display:none}.grid{gap:7px}.card{padding:5px}.card>img{height:86px}.shop-meta{gap:4px;font-size:8px}.shop-meta img{width:18px;height:18px}.card h3{min-height:38px;font-size:10px}.price{font-size:11px}}
</style>
<style>
.share-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.share-option{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:58px;padding:8px 4px;color:#fff;border:0;border-radius:11px;font:700 10px 'Plus Jakarta Sans',Arial,sans-serif;cursor:pointer}.share-option i{font-size:18px}.share-option.whatsapp{background:#25a65a}.share-option.facebook{background:#1877f2}.share-option.instagram{background:linear-gradient(115deg,#833ab4,#fd1d1d,#fcb045)}.share-option.tiktok{background:#111827}.share-option.youtube{background:#e62117}.share-option.more{background:#e83e8c}.share-option:hover{filter:brightness(.92)}
</style>
</head>
<body>
<header class="top"><a class="back" href="index.html">← ALEE SHOPPING</a><div class="brand"><h1 id="headerShopName">Shop</h1><img id="headerShopLogo" src="assets/alee-logo.png" alt="Shop logo"></div></header>
<main class="wrap"><section class="shop-profile" id="shopProfile"></section><h2 class="section-title">Products</h2><section class="grid" id="products"></section></main>
<div class="share-overlay" id="shareOverlay" aria-hidden="true"><section class="share-modal" role="dialog" aria-modal="true" aria-labelledby="shareTitle"><button class="share-close" id="shareClose" type="button" aria-label="Close share dialog"><i class="fa-solid fa-xmark"></i></button><h2 id="shareTitle">Share shop</h2><p>Scan the QR code or choose where to share this shop.</p><div class="share-qr" id="shareQr" aria-label="Shop QR code"></div><div class="share-url" id="shareUrl"></div><button class="copy-link-button" id="copyShopLink" type="button"><i class="fa-regular fa-copy"></i><span>Copy link</span></button><div class="share-options" id="shareOptions"><button type="button" data-share="whatsapp" class="share-option whatsapp"><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></button><button type="button" data-share="facebook" class="share-option facebook"><i class="fa-brands fa-facebook-f"></i><span>Facebook</span></button><button type="button" data-share="instagram" class="share-option instagram"><i class="fa-brands fa-instagram"></i><span>Instagram</span></button><button type="button" data-share="tiktok" class="share-option tiktok"><i class="fa-brands fa-tiktok"></i><span>TikTok</span></button><button type="button" data-share="youtube" class="share-option youtube"><i class="fa-brands fa-youtube"></i><span>YouTube</span></button><button type="button" data-share="more" class="share-option more"><i class="fa-solid fa-arrow-up-from-bracket"></i><span>More apps</span></button></div><div class="share-status" id="shareStatus" role="status" aria-live="polite"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js"></script><script src="products.js"></script><script src="shops.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const shops=Array.isArray(window.aleeShops)?window.aleeShops:[];
const products=Array.isArray(window.aleeProducts)?window.aleeProducts:[];
const params=new URLSearchParams(location.search), shopId=params.get('shop'); let shop=shops.find(item=>String(item.id)===shopId);
const supabaseClient=window.aleeSupabase||null;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderShopPage(){
if(!shop){document.getElementById('shopProfile').innerHTML='<div><h2>Shop not found</h2><p>Please return to ALEE SHOPPING and choose a shop.</p></div>';document.getElementById('products').innerHTML='';return;}
 document.documentElement.style.setProperty('--shop-accent',/^#[0-9a-f]{6}$/i.test(shop.accentColor||'')?shop.accentColor:'#FF6900');
 document.title=`${shop.name} — ALEE SHOPPING`;
 document.getElementById('headerShopName').textContent=shop.name;
 document.getElementById('headerShopLogo').src=shop.logo||'assets/alee-logo.png';
  const phone=String(shop.phone||'').trim(), phone2=String(shop.phone2||'').trim(), address=String(shop.address||'').trim();
  const socials=[['facebook','Facebook','fa-facebook-f'],['instagram','Instagram','fa-instagram'],['youtube','YouTube','fa-youtube'] ,['tiktok','TikTok','fa-tiktok']].filter(([key])=>/^https?:\/\//i.test(String(shop[key]||'')));
  const externalLink=/^https?:\/\//i.test(String(shop.externalLink||''))?`<a class="social-link" style="background:#475569" href="${esc(shop.externalLink)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-link"></i><span>Shop link</span></a>`:'';
 const contact=phone?`<a class="contact-card" href="tel:${encodeURIComponent(phone)}"><i class="fa-solid fa-phone"></i><span>${esc(phone)}</span></a>`:'';
  const contact2=phone2?`<a class="contact-card" href="tel:${encodeURIComponent(phone2)}"><i class="fa-solid fa-phone"></i><span>${esc(phone2)}</span></a>`:'';
 const location=address?`<div class="contact-card address"><i class="fa-solid fa-location-dot"></i><span>${esc(address)}</span></div>`:'';
 const socialButtons=socials.map(([key,label,icon])=>`<a class="social-link ${key}" href="${esc(shop[key])}" target="_blank" rel="noopener noreferrer"><i class="fa-brands ${icon}"></i><span>${label}</span></a>`).join('');
 const whatsapp=phone?phone.replace(/\D/g,''):'';
 const whatsappButton=whatsapp?`<a class="social-link" style="background:#25d366" href="https://wa.me/${encodeURIComponent(whatsapp)}" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></a>`:'';
  const canMessage=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(shop.id));
  const messageButton=`<button class="profile-message-button" id="openShopMessage" type="button" aria-label="Message ${esc(shop.name)}"><i class="fa-regular fa-comments" aria-hidden="true"></i><span class="share-label">Message</span></button>`;
  document.getElementById('shopProfile').innerHTML=`<div class="profile-main"><div class="profile-copy"><div class="shop-kicker">${esc(shop.shopCategory||'SHOP')}</div><h2>${esc(shop.name)}</h2><p>Products available from this shop</p></div><div class="profile-actions"><img class="profile-logo" src="${esc(shop.logo||'assets/alee-logo.png')}" alt="${esc(shop.name)} logo" onerror="this.src='assets/alee-logo.png'">${messageButton}<button class="share-button" id="openShare" type="button" aria-label="Share ${esc(shop.name)} shop"><i class="fa-solid fa-share-nodes" aria-hidden="true"></i><span class="share-label">Share</span></button></div></div>${contact||contact2||location?`<div class="shop-contact-grid">${contact}${contact2}${location}</div>`:''}${socialButtons||whatsappButton||externalLink?`<div class="social-links">${socialButtons}${whatsappButton}${externalLink}</div>`:''}`;
 const shareOverlay=document.getElementById('shareOverlay'),shareQr=document.getElementById('shareQr'),shareUrl=document.getElementById('shareUrl'),shareStatus=document.getElementById('shareStatus');
 const shopLink=new URL('shop.html',window.location.href);shopLink.searchParams.set('shop',String(shop.id));
 const copyShopLink=async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(shopLink.href);}else{const input=document.createElement('textarea');input.value=shopLink.href;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();const copied=document.execCommand('copy');input.remove();if(!copied)throw new Error('Copy unavailable');}shareStatus.textContent='Shop link copied.';return true;}catch(error){shareStatus.textContent='Could not copy automatically. Select and copy the link above.';return false;}};
 const openShareDialog=()=>{shareOverlay.classList.add('show');shareOverlay.setAttribute('aria-hidden','false');document.getElementById('shareTitle').textContent=`Share ${shop.name}`;shareUrl.textContent=shopLink.href;shareStatus.textContent='';shareQr.replaceChildren();if(window.QRCode){new QRCode(shareQr,{text:shopLink.href,width:204,height:204,colorDark:'#111827',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});}else{shareQr.textContent='QR code needs an internet connection to load.';}document.getElementById('copyShopLink').focus();};
 const closeShareDialog=()=>{shareOverlay.classList.remove('show');shareOverlay.setAttribute('aria-hidden','true');document.getElementById('openShare')?.focus();};
 document.getElementById('openShopMessage')?.addEventListener('click',()=>{if(canMessage)window.aleeChat?.openShop(shop.id,shop.name);else window.aleeChat?.openHome();});
 document.getElementById('openShare').addEventListener('click',openShareDialog);document.getElementById('shareClose').addEventListener('click',closeShareDialog);shareOverlay.addEventListener('click',event=>{if(event.target===shareOverlay)closeShareDialog();});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&shareOverlay.classList.contains('show'))closeShareDialog();});
 document.getElementById('copyShopLink').addEventListener('click',copyShopLink);
 document.getElementById('shareOptions').addEventListener('click',async event=>{const button=event.target.closest('[data-share]');if(!button)return;const target=button.dataset.share;if(target==='more'){if(!navigator.share){shareStatus.textContent='Use the Copy link button, then paste the link into your preferred app.';return;}try{await navigator.share({title:shop.name,text:`Check out ${shop.name}`,url:shopLink.href});shareStatus.textContent='Shop link shared.';}catch(error){if(error.name!=='AbortError')shareStatus.textContent='Sharing was not available. Copy the shop link instead.';}return;}if(target==='whatsapp'){window.open(`https://wa.me/?text=${encodeURIComponent(`Check out ${shop.name}: ${shopLink.href}`)}`,'_blank','noopener,noreferrer');return;}if(target==='facebook'){window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shopLink.href)}`,'_blank','noopener,noreferrer');return;}const platformUrls={instagram:'https://www.instagram.com/',tiktok:'https://www.tiktok.com/',youtube:'https://www.youtube.com/'};const opened=window.open(platformUrls[target],'_blank','noopener,noreferrer');await copyShopLink();if(opened)shareStatus.textContent=`Shop link copied. Paste it into ${button.textContent.trim()}.`;});
 const list=products.filter(item=>String(item.shopId||shops[0]?.id||'alee-shopping')===String(shop.id));
 document.getElementById('products').innerHTML=list.length?list.map(item=>`<a class="card" href="index.html?product=${encodeURIComponent(item.id)}"><img src="${esc(item.images?.[0]||'assets/alee-logo.png')}" alt="${esc(item.name)}" loading="lazy" onerror="this.src='assets/alee-logo.png'"><div class="shop-meta"><img src="${esc(shop.logo||'assets/alee-logo.png')}" alt=""><span>${esc(shop.name)}</span></div><h3>${esc(item.name)}</h3><div class="price">LKR ${Number(item.price||0).toLocaleString()}</div></a>`).join(''):'<div class="empty">This shop has no products yet.</div>';
}
async function loadAndRenderShop(){
 if(!shop&&supabaseClient&&shopId){
  const {data:row,error}=await supabaseClient.from('seller_shops_public').select('*').eq('id',shopId).maybeSingle();
  if(!error&&row){shop={id:String(row.id),name:row.shop_name,logo:row.logo_url||'assets/alee-logo.png',phone:row.phone||'',phone2:row.phone2||'',address:row.address||'',externalLink:row.external_link||'',shopCategory:row.shop_category||'Other',facebook:row.facebook_url||'',instagram:row.instagram_url||'',youtube:row.youtube_url||'',rank:9999,rating:5};
   const {data:items}=await supabaseClient.from('seller_products_public').select('*').eq('shop_id',shopId);
   (items||[]).forEach(item=>products.push({id:1000000000+Number(item.id),name:item.name,price:Number(item.price),category:item.category,shopId:String(item.shop_id),desc:item.description||'',features:item.features||[],sizes:item.sizes||[],images:item.image_urls||[]}));
   shops.push(shop);
  }
 }
 renderShopPage();
}
loadAndRenderShop();
</script>
<script src="chat.js?v=20261018-chat-webrtc"></script>
</body></html>
