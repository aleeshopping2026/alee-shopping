<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shops — ALEE SHOPPING</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--orange:#ff6900;--ink:#172033;--muted:#64748b;--line:#ffd1b3;--surface:#fff;--page:#f8fafc}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:'Plus Jakarta Sans',Arial,sans-serif}
    .top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px max(16px,calc((100vw - 1180px)/2));background:var(--surface);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:9px;color:var(--orange);font-size:18px;font-weight:800;text-decoration:none}.brand img{width:34px;height:34px;object-fit:cover;border-radius:8px}
    .back{color:var(--orange);font-size:13px;font-weight:800;text-decoration:none;white-space:nowrap}
    main{max-width:1180px;margin:26px auto;padding:0 16px}h1{margin:0;color:var(--ink);font-size:clamp(24px,4vw,34px)}.intro{margin:7px 0 20px;color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .shop-card{display:flex;align-items:center;gap:14px;min-width:0;padding:16px;color:var(--ink);text-decoration:none;background:linear-gradient(120deg,#fff,#fff7f2 65%,#fff0f6);border:1px solid var(--shop-accent,#ff6900);border-radius:16px;box-shadow:0 5px 18px #1720330a;transition:transform .18s,box-shadow .18s}
    .shop-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #17203318}.shop-card img{width:70px;height:70px;flex:0 0 70px;object-fit:cover;border:3px solid var(--shop-accent,#ff6900);border-radius:50%;background:#fff}
    .copy{min-width:0}.copy strong{display:block;overflow-wrap:anywhere;font-size:16px}.copy small{display:block;margin-top:5px;color:var(--muted);font-size:12px}.stars{margin-top:5px;color:#f59e0b;font-size:13px;letter-spacing:1px}.arrow{margin-left:auto;color:var(--shop-accent,#ff6900)}
    .empty{padding:24px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--muted)}
    @media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
    @media(max-width:480px){.top{padding:9px 12px}.brand{font-size:15px}.brand img{width:30px;height:30px}main{margin:18px auto;padding:0 12px}.grid{grid-template-columns:1fr;gap:10px}.shop-card{padding:13px}.shop-card img{width:60px;height:60px;flex-basis:60px}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="index.html"><img src="assets/alee-logo.png" alt=""><span>ALEE SHOPPING</span></a><a class="back" href="index.html">← Back to home</a></header>
  <main><h1>Shops</h1><p class="intro">Choose a shop to browse its products and contact details.</p><section class="grid" id="shopGrid" aria-label="All shops"></section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js"></script><script src="shops.js"></script><script src="products.js"></script>
  <script>
    const shops=Array.isArray(window.aleeShops)?window.aleeShops:[];
    const products=Array.isArray(window.aleeProducts)?window.aleeProducts:[];
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const grid=document.getElementById('shopGrid');
    async function renderShopDirectory(){
      if(window.aleeSupabase){
        const [{data:shopRows},{data:productRows}]=await Promise.all([
          window.aleeSupabase.from('seller_shops_profile_public').select('*'),
          window.aleeSupabase.from('seller_products_public').select('id,shop_id')
        ]);
        (shopRows||[]).forEach(row=>shops.push({id:String(row.id),name:row.shop_name,logo:row.logo_url||'assets/alee-logo.png',phone:row.phone||'',phone2:row.phone2||'',address:row.address||'',externalLink:row.external_link||'',shopCategory:row.shop_category||'Other',bio:row.bio||'',facebook:row.facebook_url||'',instagram:row.instagram_url||'',youtube:row.youtube_url||'',tiktok:row.tiktok_url||'',rank:9999,rating:5}));
        (productRows||[]).forEach(row=>products.push({id:`seller-${row.id}`,shopId:String(row.shop_id)}));
      }
      const entries=shops.map((shop,index)=>({shop,index})).filter(({shop})=>shop?.id&&shop?.name).sort((a,b)=>{
        const rankA=Number(a.shop.rank),rankB=Number(b.shop.rank);
        return (Number.isFinite(rankA)&&rankA>0?rankA:a.index+1)-(Number.isFinite(rankB)&&rankB>0?rankB:b.index+1)||a.index-b.index;
      });
      if(!entries.length)grid.innerHTML='<div class="empty">No shops have been added yet.</div>';
      else grid.innerHTML=entries.map(({shop})=>{
        const accent=/^#[0-9a-f]{6}$/i.test(shop.accentColor||'')?shop.accentColor:'#ff6900';
        const rating=Math.min(5,Math.max(1,Math.round(Number(shop.rating)||5)));
        const count=products.filter(product=>String(product.shopId||shops[0]?.id||'alee-shopping')===String(shop.id)).length;
        return `<a class="shop-card" style="--shop-accent:${accent}" href="shop.html?shop=${encodeURIComponent(shop.id)}"><img src="${esc(shop.logo||'assets/alee-logo.png')}" alt="${esc(shop.name)} logo" onerror="this.src='assets/alee-logo.png'"><span class="copy"><strong>${esc(shop.name)}</strong><small>${count} product${count===1?'':'s'}</small><span class="stars" aria-label="${rating} out of 5 stars">${'★'.repeat(rating)}${'☆'.repeat(5-rating)}</span></span><i class="fa-solid fa-chevron-right arrow" aria-hidden="true"></i></a>`;
      }).join('');
    }
    renderShopDirectory();
  </script>
</body>
</html>
