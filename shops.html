<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6900">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('alee-theme')==='dark'?'dark':'light';}catch(_){document.documentElement.dataset.theme='light';}</script>
  <title>Shops — aleeshopping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="site-theme.css?v=20261112-theme-unified">
  <style>
    :root{--orange:#ff6900;--ink:#172033;--muted:#64748b;--line:#e5e7eb;--surface:#fff;--page:#f7f8fa}
    *{box-sizing:border-box}html{scrollbar-gutter:stable}body{margin:0;background:var(--page);color:var(--ink);font-family:'Plus Jakarta Sans',Arial,sans-serif}
    .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;min-height:62px;padding:9px max(16px,calc((100vw - 1180px)/2));background:var(--orange);color:#fff;box-shadow:0 3px 12px #a744001e}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;color:#fff;text-decoration:none}.brand img{width:40px;height:40px;flex:0 0 40px;object-fit:cover;border:2px solid #ffffffb8;border-radius:50%}.brand-copy{min-width:0}.brand strong{display:block;font-size:17px;line-height:1.2;font-weight:800}.brand small{display:block;margin-top:2px;color:#fff9;font-size:11px}
    .theme-trigger{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;margin-left:auto;border:1px solid #ffffff88;border-radius:50%;background:#ffffff20;color:#fff;font-size:17px;cursor:pointer}.theme-trigger:hover{background:#ffffff33}
    .search-bar{position:sticky;top:62px;z-index:4;padding:10px max(16px,calc((100vw - 1180px)/2));background:var(--surface);border-bottom:1px solid var(--line)}
    .search-wrap{position:relative;max-width:1180px;margin:auto}.search{width:100%;height:48px;padding:0 48px 0 44px;border:1px solid #d8dee7;border-radius:16px;background:var(--page);color:var(--ink);font:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}.search:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff690020}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#7a8492;font-size:17px;pointer-events:none}.clear-search{position:absolute;right:9px;top:50%;display:none;place-items:center;width:32px;height:32px;transform:translateY(-50%);border:0;border-radius:50%;background:transparent;color:#667085;font-size:15px;cursor:pointer}.clear-search.visible{display:grid}.clear-search:hover{background:#eef0f3}
    main{width:min(1180px,100%);margin:0 auto;padding:22px 16px 50px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 0 17px}.intro h1{margin:0;font-size:clamp(22px,4vw,30px);letter-spacing:-.04em}.intro p{margin:5px 0 0;color:var(--muted);font-size:13px}.result-count{flex:0 0 auto;color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.shop-card{display:flex;min-width:0;min-height:150px;flex-direction:column;align-items:center;gap:8px;padding:12px 7px 11px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-align:center;text-decoration:none;box-shadow:0 2px 8px #10182808;transition:transform .18s,box-shadow .18s,border-color .18s}.shop-card:hover,.shop-card:focus-visible{transform:translateY(-2px);border-color:#ffb27d;box-shadow:0 9px 22px #10182813;outline:none}.logo-ring{display:grid;place-items:center;width:clamp(56px,13vw,82px);height:clamp(56px,13vw,82px);flex:0 0 auto;overflow:hidden;border:1px solid #edf0f3;border-radius:50%;background:#fff}.shop-card img.shop-logo{width:100%;height:100%;object-fit:cover;border-radius:50%}.copy{width:100%;min-width:0}.copy strong{display:flex;min-height:30px;align-items:center;justify-content:center;gap:3px;overflow:hidden;font-size:clamp(10px,1.5vw,13px);line-height:1.3;overflow-wrap:anywhere}.copy .name{display:-webkit-box;max-width:100%;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}.directory-verified{width:14px;height:14px;min-width:14px;flex:0 0 14px;object-fit:contain}.copy small{display:block;margin-top:3px;overflow:hidden;color:var(--muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.shop-category{display:inline-block;max-width:100%;margin-top:6px;padding:3px 7px;overflow:hidden;border-radius:20px;background:#fff4e8;color:#b84c00;font-size:9px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}.empty{grid-column:1/-1;padding:28px 18px;border:1px dashed #cfd5df;border-radius:16px;background:var(--surface);color:var(--muted);text-align:center;line-height:1.5}.empty i{display:block;margin-bottom:9px;color:#a6afbb;font-size:23px}
    .site-loader{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:12px;background:var(--surface);transition:opacity .2s,visibility .2s}.site-loader.hidden{opacity:0;visibility:hidden;pointer-events:none}.loader-ring{width:70px;height:70px;padding:5px;border:3px solid var(--orange);border-top-color:#f4a261;border-right-color:#ffb703;border-radius:50%;animation:spin .8s linear infinite}.loader-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;animation:spin .8s linear infinite reverse}.site-loader span{color:var(--orange);font-size:13px;font-weight:800}@keyframes spin{to{transform:rotate(360deg)}}
    html[data-theme="dark"]{--ink:#eef1f5;--muted:#aab2bf;--line:#343a46;--surface:#17191d;--page:#101216;color-scheme:dark}html[data-theme="dark"] .search{border-color:#454c57;background:#202329}html[data-theme="dark"] .shop-card{box-shadow:none}html[data-theme="dark"] .shop-card:hover{border-color:#a95722;box-shadow:0 9px 22px #0004}html[data-theme="dark"] .logo-ring{border-color:#343a46;background:#fff}html[data-theme="dark"] .shop-category{background:#382417;color:#ffb27d}html[data-theme="dark"] .clear-search:hover{background:#2a2f37}
    @media(min-width:760px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:15px}.shop-card{min-height:176px;padding:16px 10px 13px}.copy small{font-size:11px}}
    @media(min-width:1050px){.grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:16px}.intro{margin-bottom:20px}}
    @media(max-width:420px){.top{min-height:58px;padding:8px 13px}.brand img{width:36px;height:36px;flex-basis:36px}.brand strong{font-size:15px}.brand small{font-size:10px}.theme-trigger{width:38px;height:38px;flex-basis:38px}.search-bar{top:58px;padding:9px 12px}.search{height:46px;border-radius:15px;font-size:13px}main{padding:17px 12px 32px}.intro{align-items:center}.intro p{font-size:11px}.result-count{font-size:10px}.grid{gap:8px}.shop-card{min-height:137px;padding:9px 4px;border-radius:13px}.copy strong{font-size:10px}.copy small{font-size:9px}.shop-category{font-size:8px;padding:3px 5px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="site-loader" id="siteLoader" aria-live="polite"><div class="loader-ring"><img src="assets/alee-logo.png" alt=""></div><span>Loading shops…</span></div>
  <header class="top"><div class="brand"><img src="assets/alee-logo.png" alt=""><span class="brand-copy"><strong>Shops</strong><small>Browse sellers on aleeshopping</small></span></div><button class="theme-trigger" type="button" data-open-theme-settings onclick="openThemeSettings(this)" aria-label="Appearance settings" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-gear" aria-hidden="true"></i></button></header>
  <div class="search-bar"><div class="search-wrap"><i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i><input id="shopSearch" class="search" type="search" placeholder="Search shop name or category…" aria-label="Search shop name or category" autocomplete="off"><button id="clearSearch" class="clear-search" type="button" aria-label="Clear search"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></div>
  <main><div class="intro"><div><h1>All shops</h1><p>Find a shop by name or what it sells.</p></div><span id="resultCount" class="result-count" aria-live="polite"></span></div><section class="grid" id="shopGrid" aria-label="All shops"></section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js"></script><script src="shops.js?v=20261113-shop-categories-order"></script><script src="products.js"></script>
  <script>
    const localShops=Array.isArray(window.aleeShops)?window.aleeShops:[];
    const localProducts=Array.isArray(window.aleeProducts)?window.aleeProducts:[];
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const grid=document.getElementById('shopGrid'),search=document.getElementById('shopSearch'),clearButton=document.getElementById('clearSearch'),resultCount=document.getElementById('resultCount');
    const hostEmails=['aleeshopping2026@gmail.com','aleeshopping@gmail.com'];
    let shopEntries=[],shopOrder=[];
    function normalize(value){return String(value||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();}
    function editDistance(a,b){const left=Array.from(a),right=Array.from(b);if(Math.abs(left.length-right.length)>3)return 99;let previous=Array.from({length:right.length+1},(_,i)=>i);for(let i=1;i<=left.length;i++){const row=[i];for(let j=1;j<=right.length;j++)row[j]=Math.min(row[j-1]+1,previous[j]+1,previous[j-1]+(left[i-1]===right[j-1]?0:1));previous=row;}return previous[right.length];}
    function matchScore(entry,query){if(!query)return 0;const name=normalize(entry.shop.name),category=normalize(entry.shop.shopCategory),whole=`${name} ${category}`,tokens=query.split(' ').filter(Boolean);if(name===query)return 1000;if(name.startsWith(query))return 900;if(name.includes(query))return 800;if(category===query)return 760;if(category.startsWith(query))return 720;if(category.includes(query))return 680;if(tokens.every(token=>name.includes(token)))return 620;if(tokens.every(token=>category.includes(token)))return 580;if(whole.includes(query))return 500;const shopWords=whole.split(' ');const fuzzy=tokens.reduce((total,token)=>total+Math.max(0,...shopWords.map(word=>token.length>=4&&word.length>=4&&editDistance(token,word)<=Math.max(1,Math.floor(Math.min(token.length,word.length)*.25))?30:0)),0);return fuzzy===tokens.length*30?300:0;}
    function paint(){const query=normalize(search.value);clearButton.classList.toggle('visible',Boolean(search.value));const rows=shopEntries.map((entry,index)=>({...entry,index,score:matchScore(entry,query)})).filter(entry=>!query||entry.score>0).sort((a,b)=>query?(b.score-a.score||a.orderIndex-b.orderIndex):a.orderIndex-b.orderIndex);resultCount.textContent=query?`${rows.length} result${rows.length===1?'':'s'}`:`${rows.length} shop${rows.length===1?'':'s'}`;if(!rows.length){grid.innerHTML=`<div class="empty"><i class="fa-solid fa-store-slash" aria-hidden="true"></i>${shopEntries.length?'No shops match that name or category. Try a shorter search.':'No shops are available yet.'}</div>`;return;}grid.innerHTML=rows.map(({shop,count})=>`<a class="shop-card" href="shop.html?shop=${encodeURIComponent(shop.id)}" aria-label="Open ${esc(shop.name)} shop"><span class="logo-ring"><img class="shop-logo" loading="lazy" decoding="async" src="${esc(shop.logo||'assets/alee-logo.png')}" alt="${esc(shop.name)} logo" onerror="this.onerror=null;this.src='assets/alee-logo.png'"></span><span class="copy"><strong><span class="name" title="${esc(shop.name)}">${esc(shop.name)}</span>${shop.isVerified?'<img class="directory-verified" src="assets/verified-badge.svg" alt="Verified">':''}</strong><small>${count} product${count===1?'':'s'}</small><span class="shop-category">${esc(shop.shopCategory||'Other')}</span></span></a>`).join('');}
    function makeEntries(shopRows,productRows){const map=new Map();localShops.forEach((shop,index)=>{if(shop?.id&&shop?.name)map.set(String(shop.id),{...shop,_baseIndex:index});});(shopRows||[]).forEach(row=>{const id=String(row.id),old=map.get(id)||{};map.set(id,{...old,id,name:row.shop_name||old.name||'Shop',logo:row.logo_url||old.logo||'assets/alee-logo.png',shopCategory:row.shop_category||old.shopCategory||'Other',isVerified:Boolean(row.is_verified??old.isVerified),rank:old.rank??9999,_baseIndex:old._baseIndex??map.size});});const counts=new Map();localProducts.forEach(product=>{const id=String(product.shopId||localShops[0]?.id||'alee-shopping');counts.set(id,(counts.get(id)||0)+1);});(productRows||[]).forEach(row=>{const id=String(row.shop_id||'');counts.set(id,(counts.get(id)||0)+1);});const orderIndex=new Map(shopOrder.map((id,index)=>[String(id),index]));return [...map.values()].map((shop,index)=>({shop,count:counts.get(String(shop.id))||0,index,orderIndex:orderIndex.get(String(shop.id))??(shopOrder.length+index)})).sort((a,b)=>a.orderIndex-b.orderIndex||((Number(a.shop.rank)||9999)-(Number(b.shop.rank)||9999))||a.index-b.index);}
    async function loadDirectory(){const loader=document.getElementById('siteLoader');let shopRows=[],productRows=[];const client=window.aleeSupabase;if(client){const results=await Promise.allSettled([client.from('seller_shops_profile_public').select('id,shop_name,logo_url,shop_category,is_verified'),client.from('seller_products_profile_public').select('id,shop_id'),client.from('shop_directory_settings').select('shop_order').eq('setting_key','main').maybeSingle()]);if(results[0].status==='fulfilled'&&!results[0].value.error)shopRows=results[0].value.data||[];if(results[1].status==='fulfilled'&&!results[1].value.error)productRows=results[1].value.data||[];if(results[2].status==='fulfilled'&&!results[2].value.error&&Array.isArray(results[2].value.data?.shop_order))shopOrder=results[2].value.data.shop_order.map(String);}
      shopEntries=makeEntries(shopRows,productRows);paint();loader.classList.add('hidden');}
    search.addEventListener('input',paint);clearButton.addEventListener('click',()=>{search.value='';paint();search.focus();});
    window.setTimeout(()=>document.getElementById('siteLoader').classList.add('hidden'),8000);
    loadDirectory().catch(error=>{console.warn('Could not load online shops; showing shops saved in the site.',error);shopEntries=makeEntries([],[]);paint();document.getElementById('siteLoader').classList.add('hidden');});
  </script>
  <script src="site-theme.js?v=20261111"></script>
  <script src="alee-push-config.js?v=20261111"></script><script src="alee-push.js?v=20261111-profile-list"></script>
</body>
</html>
