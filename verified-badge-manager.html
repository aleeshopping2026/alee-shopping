<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6900"><title>Verified Badge Manager | aleeshopping</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172033;font:15px/1.5 system-ui,Arial}.top{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e4e7ec;padding:14px max(16px,calc((100vw - 1000px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:#f36b00;font-weight:800;text-decoration:none}.wrap{max-width:1000px;margin:22px auto;padding:0 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin-bottom:14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.shop-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eaecf0}.shop-row img.logo{width:48px;height:48px;object-fit:cover;border-radius:13px;border:1px solid #e5e7eb}.shop-row strong{display:flex;align-items:center;gap:5px}.shop-row small{display:block;color:#667085}.verified{width:18px;height:18px;vertical-align:middle}.btn{border:1px solid #d0d5dd;border-radius:9px;background:#fff;padding:8px 11px;font:700 13px inherit;cursor:pointer}.btn.primary{background:#f36b00;border-color:#f36b00;color:#fff}.btn.danger{color:#b42318}.status{min-height:22px;color:#a14b08;white-space:pre-wrap}.gate{padding:16px;border:1px solid #fed7aa;border-radius:14px;background:#fff7ed}[hidden]{display:none!important}@media(max-width:560px){.top{align-items:flex-start;flex-wrap:wrap}.shop-row{grid-template-columns:42px 1fr}.shop-row img.logo{width:40px;height:40px}.shop-row .actions{grid-column:1/-1;display:flex;gap:6px}.shop-row .actions input{flex:1;min-width:120px}}
</style></head><body><header class="top"><a href="manager-center.html"><i class="fa-solid fa-arrow-left"></i> Content Managers</a><strong>Verified Badge Manager</strong><span id="who" style="color:#667085;font-size:12px"></span></header><main class="wrap"><section id="gate" class="gate" hidden></section><section id="manager" hidden><div class="card"><h2 style="margin-top:0">Shops</h2><p style="color:#667085">Review WhatsApp requests, then grant or remove the blue verified badge. It is 20px in shop cards and 12px in product lists. The public shop profile uses the larger 32px version.</p><div class="toolbar"><input id="search" type="search" placeholder="Search shop name, category, country or phone…"><button class="btn" id="reload">Refresh</button></div><p class="status" id="status" role="status"></p></div><div class="card" id="shops"><p>Loading shops…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js"></script><script>
(async()=>{const admins=['aleeshopping2026@gmail.com','aleeshopping@gmail.com'],client=window.aleeSupabase,gate=document.getElementById('gate'),manager=document.getElementById('manager'),root=document.getElementById('shops'),status=document.getElementById('status'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];if(!client){gate.hidden=false;gate.textContent='Supabase is not configured. Check backend-config.js.';return;}const{data:{session},error}=await client.auth.getSession();const user=session?.user;document.getElementById('who').textContent=user?.email||'';if(error||!admins.includes(String(user?.email||'').toLowerCase())){gate.hidden=false;gate.textContent='Host access only. Sign in with an authorized aleeshopping account.';return;}manager.hidden=false;async function load(){root.innerHTML='<p>Loading shops…</p>';const result=await client.from('seller_shops_profile_public').select('id,shop_name,logo_url,phone,shop_category,country_code,is_verified,verified_until').order('shop_name');if(result.error){root.innerHTML='<div class="gate">Could not load shops. Run verified-badges-schema.sql after seller-marketplace-schema.sql.<br>'+esc(result.error.message)+'</div>';return;}rows=result.data||[];render();}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),filtered=rows.filter(row=>[row.shop_name,row.phone,row.shop_category,row.country_code].some(value=>String(value||'').toLowerCase().includes(q)));if(!filtered.length){root.innerHTML='<p>No shops match the search.</p>';return;}root.innerHTML=filtered.map(row=>`<article class="shop-row" data-id="${esc(row.id)}"><img class="logo" src="${esc(row.logo_url||'assets/alee-logo.png')}" alt=""><div><strong>${esc(row.shop_name)} ${row.is_verified?'<img class="verified" src="assets/verified-badge.svg" alt="Verified">':''}</strong><small>${esc(row.shop_category||'Other')} · ${esc(row.country_code||'')} · ${esc(row.phone||'No phone')}</small><small>${row.is_verified?'Verified until '+(row.verified_until?new Date(row.verified_until).toLocaleDateString():'No expiry'):'Not verified'}</small></div><div class="actions">${row.is_verified?'<button class="btn danger" data-remove>Remove badge</button>':'<select aria-label="Badge duration" data-duration><option value="1">1 month · $10</option><option value="12">12 months · $96</option><option value="0">No expiry · host approved</option></select> <button class="btn primary" data-grant>Grant badge</button>'}</div></article>`).join('');root.querySelectorAll('[data-grant]').forEach(button=>button.onclick=()=>grant(button.closest('.shop-row')));root.querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>revoke(button.closest('.shop-row')));}async function grant(card){const row=rows.find(item=>String(item.id)===card.dataset.id),months=Number(card.querySelector('[data-duration]').value),expires=months?new Date(Date.now()+months*30.4375*86400000).toISOString():null;status.textContent='Saving verified badge…';const result=await client.from('shop_verified_badges').upsert({shop_id:row.id,granted_by:user.id,expires_at:expires,notes:'Granted by aleeshopping host'},{onConflict:'shop_id'});if(result.error){status.textContent='Could not add badge: '+result.error.message+' — run verified-badges-schema.sql.';return;}status.textContent='Verified badge added to '+row.shop_name+'.';await load();}async function revoke(card){const row=rows.find(item=>String(item.id)===card.dataset.id);if(!confirm('Remove the verified badge from '+row.shop_name+'?'))return;const result=await client.from('shop_verified_badges').delete().eq('shop_id',row.id);if(result.error){status.textContent='Could not remove badge: '+result.error.message;return;}status.textContent='Verified badge removed.';await load();}document.getElementById('search').addEventListener('input',render);document.getElementById('reload').addEventListener('click',load);await load();})();
</script></body></html>
